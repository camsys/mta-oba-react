name: Tag and PR Integrity
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: Build Check
        run: npm run build
        env:
          CI: true
          GA_MEASUREMENT_ID: G-TEST1234

      - name: Google tag on every page
        run: npm run check-ga-tag
        env:
          GA_MEASUREMENT_ID: G-TEST1234
